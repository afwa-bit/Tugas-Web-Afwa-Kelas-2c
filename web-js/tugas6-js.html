<!DOCTYPE html>
<html>
<head>
    <title>Tugas 6</title>
</head>
<body>

    <h1>Tugas 6 Javascript</h1>
    <h2>Perulangan FOR</h2>

    <script type="text/javascript">
         
        for( var i=1; i<=10; i++) {
 
            document.write('<p>Angka ke - '+i+'</p>');
 
        } 
 
    </script>


    <h2>Perulangan WHILE</h2>

    <script type="text/javascript">
        var a=0;
 
        while(a<10) {
 
            document.write('<p>Tulisan ini diulang 10 kali</p>');
 
            a+=1;
        }
    </script>


    <h2>Perulangan DO WHILE</h2>

    <script type="text/javascript">
        var a=0;
 
        do {
 
            document.write('<p>Angka ke - '+a+'</p>');
 
            a+=1;
 
        } while(a<10);
    </script>


    <h2>Perulangan FOREACH</h2>

    <script type="text/javascript">
         
        document.write('<h2>Daftar Siswa</h2>');
 
        var siswa = ['afwa', 'luqi', 'wafa', 'rama'];
         
        siswa.forEach(function(i){
            document.write('<p>'+i+'</p>');
        });     
 
    </script>

</body>
</html>
