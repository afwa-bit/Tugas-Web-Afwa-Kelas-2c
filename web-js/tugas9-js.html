<!DOCTYPE html>
<html>
<head>
    <title>Penerapan Fungsi - Aplikasi Pendataan Barang</title>
</head>
<body>
    <h2>Aplikasi Pendataan Barang</h2>
 
    <fieldset>
        <label>Masukan Nama Barang</label>
        <input type="text" id="nama">
        <button onclick="AddData();">Simpan</button> 
    </fieldset>
 
    <ul id="list-barang">
         
    </ul>
 
    <script type="text/javascript">
        // 1. Array pusat penyimpanan data
        var barang = ['Laptop Mac', 'Iphone 18 Pro Max', 'Samsung Galaxy s23 Ultra', 'Xiaomi 13 Pro', 'Oppo Find X6 Pro'];
         
        // 2. Fungsi menampilkan data ke elemen HTML
        function ShowData() {
            var listBarang = document.getElementById('list-barang');
         
            // Mengosongkan isi list agar tidak terjadi duplikasi saat dirender ulang
            listBarang.innerHTML = '';
         
            // Melakukan perulangan untuk membaca setiap isi array
            for (var i = 0; i < barang.length; i++) {
                var linkHapus = '<a href="#" onclick="DelData(' + i + ')">Hapus</a>';
                listBarang.innerHTML += '<li>' + barang[i] + ' ' + linkHapus + '</li>';
            }   
        }
         
        // 3. Fungsi menambahkan data baru ke dalam array
        function AddData() {
            var input = document.getElementById('nama');
            
            // Validasi sederhana agar tidak menginput data kosong
            if (input.value.trim() === '') {
                alert('Nama barang tidak boleh kosong!');
                return;
            }

            // Memasukkan nilai input ke array menggunakan method push()
            barang.push(input.value);
            
            // Memperbarui tampilan list di web
            ShowData();
            
            // Mengosongkan kembali kolom input setelah data disimpan
            input.value = '';
        }
         
        // 4. Fungsi menghapus data dari array berdasarkan indeks (id)
        function DelData(id) {
            // Menghapus 1 elemen dari array pada indeks ke-id
            barang.splice(id, 1);
            
            // Memperbarui tampilan list di web
            ShowData();
        }
         
        // Menjalankan fungsi tampil data secara otomatis saat halaman pertama kali dimuat
        ShowData();
    </script>
</body>
</html>
