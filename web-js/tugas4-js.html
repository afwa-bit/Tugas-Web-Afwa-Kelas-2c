<!DOCTYPE html>

<body>
    <h1>Tugas 4 Javascript</h1>
    <h2>1. Operator Aritmatika</h2>
    <script type="text/javascript">
        var a = 3;
        document.write('a = '+a+'<br>');
        var b = 2;
        document.write('b = '+b+'<br>');
        var c = 0;
 
        //penjumlahan
        c = a + b;
        document.write('a + b = '+c+'<br>');
 
        //pengurangan
        c = a - b;
        document.write('a - b = '+c+'<br>');
 
        //perkalian
        c = a * b;
        document.write('a * b = '+c+'<br>');
 
        //pembagian
        c = a / b;
        document.write('a / b = '+c+'<br>');
 
        //pemangkatan
        c = a ** b;
        document.write('a ** b = '+c+'<br>');
 
        //sisa bagi
        c = a % b;
        document.write('a % b = '+c+'<br>');
 
    </script>
 
</body>
</html>

    <h2>2. Operator Penugasan</h2>
    <script type="text/javascript">
        var skor = 0;
        document.write('skor sekarang = '+skor+'<br>');
 
        //penambahan
        skor +=10;
        document.write('skor sekarang = '+skor+'<br>');
 
        //pengurangan
        skor -=5;
        document.write('skor sekarang = '+skor+'<br>');
 
        //perkalian
        skor *=10;
        document.write('skor sekarang = '+skor+'<br>');
 
        //pembagian
        skor /=5;
        document.write('skor sekarang = '+skor+'<br>');
 
        //pemangkatan
        skor **=2;
        document.write('skor sekarang = '+skor+'<br>');
 
        //sisa bagi
        skor %=2;
        document.write('skor sekarang = '+skor+'<br>');
 
    </script>
 
</body>
</html>

    <h2>3. Operator Pembanding</h2>
    <script type="text/javascript">
        var a = 3;
        document.write('a = '+a+'<br>');
        var b = 2;
        document.write('b = '+b+'<br>');
        var c;
 
        //sama dengan
        c = a == b;
        document.write('a == b = '+c+'<br>');
 
        //lebih besar
        c = a > b;
        document.write('a > b = '+c+'<br>');
 
        //lebih besar sama dengan
        c = a >= b;
        document.write('a >= b = '+c+'<br>');
 
        //kurang dari
        c = a < b;
        document.write('a < b = '+c+'<br>');
 
        //kurang dari sama dengan
        c = a <= b;
        document.write('a <= b = '+c+'<br>');
 
        //tidak sama dengan
        c = a != b;
        document.write('a != b = '+c+'<br>');
 
    </script>
 
</body>
</html>

    <h2>4. Operator Logika</h2>
    <script type="text/javascript">
        var a = true;
        document.write('a = '+a+'<br>');
        var b = false;
        document.write('b = '+b+'<br>');
        var c;
 
        //AND
        c = a && b;
        document.write('a AND b = '+c+'<br>');
 
        //OR
        c = a || b;
        document.write('a OR b = '+c+'<br>');
 
        //NOT
        c = !b;
        document.write('NOT b = '+c+'<br>');
 
    </script>
 
</body>
</html>
</body>
